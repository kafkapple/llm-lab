[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumai-tech-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
mamba = ["mamba-ssm"]
real = ["accelerate==1.9.0", "bitsandbytes==0.46.1", "datasets==4.0.0", "matplotlib==3.10.3", "pillow==11.3.0", "soundfile==0.13.1", "transformers"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
