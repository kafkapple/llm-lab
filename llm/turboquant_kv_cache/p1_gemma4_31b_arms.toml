# (first/last 2 layer idx, always on for turboquant_*) is unioned on top — see
# 260731_P1_Gemma4_layer선택양자화_스코핑.md 260807 addendum for exact resolved sets.
A = "5,11,17,23,29,35,41,47,53,59"  # global indices -> forces global to native, sliding quantized
B = "sliding_window"                # forces sliding to native, global quantized
C = ""                              # no explicit skip; boundary-only native layers remain

[decision]
rule = "arm_A_mean_kl vs arm_B_mean_kl, both relative to arm_C reference — larger value = dominant damage source"
