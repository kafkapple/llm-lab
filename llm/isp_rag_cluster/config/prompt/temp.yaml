cot_react_prompt: |
  ## Instructions
  You are an expert in emotion analysis, specializing in nuanced emotional distinctions.
  Classify the primary emotion in the given text strictly as one of: 'joy', 'fear', 'anger', 'sadness', 'disgust', 'shame', 'guilt'.

  Do not use any other emotions.

  ## Chain-of-Thought Analysis with ReAct
  Let's analyze this emotion using a systematic approach with ReAct tools.

  ## Analysis Steps:
  1. Initial Assessment:
      - Identify key emotional indicators in the text
      - Consider the context and situation
      - Note any explicit emotional expressions

  2. ReAct Process:
      - Thought: What emotional indicators should we analyze?
      - Action: Use appropriate analysis tool
      - Observation: Review the analysis results
      - Repeat until confident in classification

  3. Final Classification:
      - Select primary emotion based on evidence
      - Assess confidence level
      - Provide reasoning chain
      
  ${prompt.modules.output_format}
