round_digits: 1
style: "seaborn-v0_8-paper"
font:
  family: "DejaVu Sans"
  size: 11
  title_size: 14
  label_size: 10
  value_size: 5
figure:
  dpi: 300
  bbox_inches: "tight"
  pad_inches: 0.2
colors:
  match: ["#2ecc71", "#27ae60", "#1e8449"]
  mismatch: ["#e74c3c", "#c0392b", "#962e23"] 

options:
  alpha: 0.8
  edgecolor: "black"
  linewidth: 1

palette:
  unknown: "YlOrRd"
  error: "#000000" #black
  metric:
    precision: "#a6cee3" #"#66c2a5"
    recall: "#1f78b4" #"#3288bd"
    f1-score: "#08306b" #"#1f78b4"

table:
  metric: f1 #'f1'
  models: all #None
  prompts: all #['no_persona_prompt', 'zero_shot_prompt', 'few_shot_prompt', 'rag_prompt_BAAI_bge-m3'] #None


